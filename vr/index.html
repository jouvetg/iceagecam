<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Time Machine · VR</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>


<aside id="panel" class="glass">
  <button id="panelToggle" class="iconbtn" data-i18n-title="panelToggle"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="panel-body">
    <section>
      <h3 data-i18n="layer"></h3>
      <div class="seg" id="mode">
        <button data-v="0" class="on" data-i18n="texture"></button>
        <button data-v="1" data-i18n="thickness"></button>
        <button data-v="2" data-i18n="speed"></button>
      </div>
      <div id="legend" class="legend hidden">
        <div class="bar" id="legendBar"></div>
        <div class="ticks" id="legendTicks"></div>
      </div>
      <label class="row" id="opacityRow" hidden><span data-i18n="opacity"></span> <input id="opacity" type="range" min="0" max="1" step="0.05" value="0.75"></label>
    </section>
    <section>
      <h3 data-i18n="terrain"></h3>
      <label class="row"><span data-i18n="exag"></span> <output id="exagOut">2.5×</output>
        <input id="exag" type="range" min="1" max="6" step="0.1" value="2.5"></label>
      <label class="row"><span data-i18n="shade"></span> <input id="shade" autocomplete="off" type="range" min="0" max="1" step="0.05" value="0"></label>
      <label class="row"><span data-i18n="sun"></span> <input id="sunaz" type="range" min="0" max="360" step="5" value="315"></label>
      <div class="row"><span data-i18n="mesh"></span>
        <div class="seg small" id="meshRes">
          <button data-v="2" title="Native IGM grid — needs a strong GPU">125 m</button>
          <button data-v="0" class="on">250 m</button>
          <button data-v="1">500 m</button>
        </div>
      </div>
      <label class="check"><input id="hq" type="checkbox" checked> <span data-i18n="hq"></span></label>
    </section>
    <section>
      <h3 data-i18n="overlays"></h3>
      <label class="check"><input id="showBorder" type="checkbox" checked> <span data-i18n="border"></span></label>
      <label class="check"><input id="showCities" type="checkbox" checked> <span data-i18n="cities"></span></label>
    </section>
    <section>
      <h3 data-i18n="flyto"></h3>
      <div class="views" id="views"></div>
    </section>
    <section class="help" data-i18n-html="help"></section>
  </div>
</aside>

<div id="readout" class="glass hidden"></div>
<div id="loading" class="glass" data-i18n="loading">Loading…</div>

<footer id="timebar" class="glass">
  <div class="controls left">
    <button id="prev" class="iconbtn" data-i18n-title="prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button id="play" class="iconbtn big" data-i18n-title="play"></button>
    <button id="next" class="iconbtn" data-i18n-title="next"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
  </div>
  <div id="tlWrap" data-i18n-title="tlTitle"><span class="tlimg"><span class="tlinner"><img id="timeline" alt="Temperature and CO2 timeline" draggable="false"><span id="tlMarker"></span></span></span></div>
  <div class="controls right">
    <div class="seg small" id="lang" data-i18n-title="lang"><button data-v="en">EN</button><button data-v="de">DE</button><button data-v="fr">FR</button></div>
  </div>
</footer>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
