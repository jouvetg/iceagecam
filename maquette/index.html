<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiss Time Machine · Model</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<style>
  :root { --accent: #ff7738; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8edf2; font-family: system-ui, sans-serif; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #ui { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(560px, calc(100% - 32px));
    background: rgba(12, 15, 20, 0.85); border: 1px solid #2a3340; border-radius: 14px; padding: 18px 20px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 22px; color: var(--accent); }
  #sub { margin: 0 0 14px; font-size: 14px; color: #9fb0c2; }
  button { font: inherit; font-size: 17px; font-weight: 600; padding: 12px 22px; margin: 4px; border-radius: 10px; border: 0;
    cursor: pointer; background: var(--accent); color: #1b0d05; }
  .btn { display: inline-block; font-size: 17px; font-weight: 600; padding: 12px 22px; margin: 4px; border-radius: 10px;
    cursor: pointer; background: #e8edf2; color: #1b0d05; }
  .btn[hidden] { display: none; }
  button:disabled { background: #444; color: #999; cursor: not-allowed; }
  #dl { background: #e8edf2; }
  #status { margin: 10px 0 0; font-size: 13px; color: #9fb0c2; min-height: 1em; }
  #loading { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #9fb0c2; }
  body.xr #ui, body.xr #loading { display: none; }
  video { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<div id="scene"></div>
<div id="loading">Loading…</div>
<div id="ui">
  <h1 id="title">Swiss Time Machine</h1>
  <p id="sub"></p>
  <label id="pickLabel" class="btn" hidden><span id="pickText"></span><input id="pick" type="file" accept="video/mp4,video/*" hidden></label>
  <button id="dl" hidden></button>
  <button id="enter" disabled></button>
  <p id="status"></p>
</div>
<video id="film" playsinline preload="auto"></video>
<script type="module" src="app.js"></script>
</body>
</html>
